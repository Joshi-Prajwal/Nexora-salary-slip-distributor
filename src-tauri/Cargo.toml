[package]
name = "nexora-salary-slip-distributor"
version = "0.1.0"
description = "Local Salary Slip Distribution Desktop Application"
authors = ["Nexora Core Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
tauri-plugin-opener = "2.2.0"
tauri-plugin-dialog = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
walkdir = "2"
pdf-extract = "0.7"
regex = "1"
image = "0.24"
lettre = { version = "0.11", features = ["builder", "smtp-transport", "native-tls"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
